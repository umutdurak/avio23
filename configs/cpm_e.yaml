# Avio23 - Electrical Domain (CPM-E) Hypervisor Configuration
# Hosts: local Network I/O Gateway and two Electrical applications

major_frame: 40ms

partitions:
  - id: 0
    name: cpm_e_gateway
    duration: 3ms
    offset: 0ms
    period: 40ms
    image: cpm_e_gateway
    sockets:
      - type: udp
        address: 0.0.0.0:49004

  - id: 1
    name: generator_control
    duration: 2ms
    offset: 4ms
    period: 40ms
    image: generator_control

  - id: 2
    name: load_shedding
    duration: 2ms
    offset: 8ms
    period: 40ms
    image: load_shedding

channel:
  # Gateway -> Applications: sensor data
  - !Sampling
    msg_size: 1KB
    source:
      partition: cpm_e_gateway
      port: iom_to_elec
    destination:
      - partition: generator_control
        port: iom_to_elec
      - partition: load_shedding
        port: iom_to_elec

  # Applications -> Gateway: status commands
  - !Sampling
    msg_size: 1KB
    source:
      partition: generator_control
      port: gen_to_iom
    destination:
      - partition: cpm_e_gateway
        port: gen_to_iom

  - !Sampling
    msg_size: 1KB
    source:
      partition: load_shedding
      port: shed_to_iom
    destination:
      - partition: cpm_e_gateway
        port: shed_to_iom
