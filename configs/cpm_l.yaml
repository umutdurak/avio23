# Avio23 - Landing Gear Domain (CPIOM-L) Hypervisor Configuration
# Hosts: Extension/Retraction, Braking, Steering applications
# DAL B - Loss of landing gear function is hazardous

major_frame: 40ms

partitions:
  - id: 0
    name: cpiom_l
    duration: 5ms
    offset: 0ms
    period: 40ms
    image: cpiom_l

channel:
  # IOM -> Landing Gear: sensor data (airspeed, lever, pedals)
  - !Sampling
    msg_size: 1KB
    source:
      partition: sim_gateway
      port: iom_to_lg
    destination:
      - partition: cpiom_l
        port: iom_to_lg

  # Landing Gear -> IOM: command data (gear state, brake pressure, steering)
  - !Sampling
    msg_size: 1KB
    source:
      partition: cpiom_l
      port: lg_to_iom
    destination:
      - partition: sim_gateway
        port: lg_to_iom
