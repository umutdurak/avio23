# Avio23 - Landing Gear Domain (CPM-L) Hypervisor Configuration
# Hosts: local Network I/O Gateway and three Landing Gear applications

major_frame: 40ms

partitions:
  - id: 0
    name: cpm_l_gateway
    duration: 3ms
    offset: 0ms
    period: 40ms
    image: cpm_l_gateway
    sockets:
      - type: udp
        address: 0.0.0.0:49001

  - id: 1
    name: extension_retraction
    duration: 2ms
    offset: 4ms
    period: 40ms
    image: extension_retraction

  - id: 2
    name: braking
    duration: 2ms
    offset: 8ms
    period: 40ms
    image: braking

  - id: 3
    name: steering
    duration: 2ms
    offset: 12ms
    period: 40ms
    image: steering

channel:
  # Gateway -> Applications: sensor data
  - !Sampling
    msg_size: 1KB
    source:
      partition: cpm_l_gateway
      port: iom_to_lg
    destination:
      - partition: extension_retraction
        port: iom_to_lg
      - partition: braking
        port: iom_to_lg
      - partition: steering
        port: iom_to_lg

  # Applications -> Gateway: status commands
  - !Sampling
    msg_size: 1KB
    source:
      partition: extension_retraction
      port: ext_to_iom
    destination:
      - partition: cpm_l_gateway
        port: ext_to_iom

  - !Sampling
    msg_size: 1KB
    source:
      partition: braking
      port: brake_to_iom
    destination:
      - partition: cpm_l_gateway
        port: brake_to_iom

  - !Sampling
    msg_size: 1KB
    source:
      partition: steering
      port: steer_to_iom
    destination:
      - partition: cpm_l_gateway
        port: steer_to_iom
