# Avio23 - Fuel Domain (CPM-F) Hypervisor Configuration
# Hosts: local Network I/O Gateway and two Fuel applications

major_frame: 40ms

partitions:
  - id: 0
    name: cpm_f_gateway
    duration: 3ms
    offset: 0ms
    period: 40ms
    image: cpm_f_gateway
    sockets:
      - type: udp
        address: 0.0.0.0:49002

  - id: 1
    name: fuel_quantity
    duration: 2ms
    offset: 4ms
    period: 40ms
    image: fuel_quantity

  - id: 2
    name: transfer_pump
    duration: 2ms
    offset: 8ms
    period: 40ms
    image: transfer_pump

channel:
  # Gateway -> Applications: sensor data
  - !Sampling
    msg_size: 1KB
    source:
      partition: cpm_f_gateway
      port: iom_to_fuel
    destination:
      - partition: fuel_quantity
        port: iom_to_fuel
      - partition: transfer_pump
        port: iom_to_fuel

  # Applications -> Gateway: status commands
  - !Sampling
    msg_size: 1KB
    source:
      partition: fuel_quantity
      port: fuel_qty_to_iom
    destination:
      - partition: cpm_f_gateway
        port: fuel_qty_to_iom

  - !Sampling
    msg_size: 1KB
    source:
      partition: transfer_pump
      port: pump_to_iom
    destination:
      - partition: cpm_f_gateway
        port: pump_to_iom
