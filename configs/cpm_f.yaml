# Avio23 - Fuel Domain (CPIOM-F) Hypervisor Configuration
# Hosts: Fuel Quantity Computation, Transfer Pump Control applications
# DAL C - Incorrect fuel indication is a major failure condition

major_frame: 40ms

partitions:
  - id: 0
    name: cpiom_f
    duration: 5ms
    offset: 0ms
    period: 40ms
    image: cpiom_f

channel:
  # IOM -> Fuel: tank sensor data
  - !Sampling
    msg_size: 1KB
    source:
      partition: sim_gateway
      port: iom_to_fuel
    destination:
      - partition: cpiom_f
        port: iom_to_fuel

  # Fuel -> IOM: computed fuel state and commands
  - !Sampling
    msg_size: 1KB
    source:
      partition: cpiom_f
      port: fuel_to_iom
    destination:
      - partition: sim_gateway
        port: fuel_to_iom
