# Avio23 - Environmental Control System (CPM-A) Hypervisor Configuration
# Hosts: local Network I/O Gateway and two ECS applications

major_frame: 40ms

partitions:
  - id: 0
    name: cpm_a_gateway
    duration: 3ms
    offset: 0ms
    period: 40ms
    image: cpm_a_gateway
    sockets:
      - type: udp
        address: 0.0.0.0:49003

  - id: 1
    name: bleed_air
    duration: 2ms
    offset: 4ms
    period: 40ms
    image: bleed_air

  - id: 2
    name: temperature_reg
    duration: 2ms
    offset: 8ms
    period: 40ms
    image: temperature_reg

channel:
  # Gateway -> Applications: sensor data
  - !Sampling
    msg_size: 1KB
    source:
      partition: cpm_a_gateway
      port: iom_to_ecs
    destination:
      - partition: bleed_air
        port: iom_to_ecs
      - partition: temperature_reg
        port: iom_to_ecs

  # Applications -> Gateway: status commands
  - !Sampling
    msg_size: 1KB
    source:
      partition: bleed_air
      port: bleed_to_iom
    destination:
      - partition: cpm_a_gateway
        port: bleed_to_iom

  - !Sampling
    msg_size: 1KB
    source:
      partition: temperature_reg
      port: temp_reg_to_iom
    destination:
      - partition: cpm_a_gateway
        port: temp_reg_to_iom
