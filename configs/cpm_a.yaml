# Avio23 - Air Conditioning / ECS Domain (CPIOM-A) Hypervisor Configuration
# Hosts: Bleed Air Control, Temperature Regulation applications
# DAL D - Loss of cabin comfort is a minor failure condition

major_frame: 40ms

partitions:
  - id: 0
    name: cpiom_a
    duration: 5ms
    offset: 0ms
    period: 40ms
    image: cpiom_a

channel:
  # IOM -> ECS: cabin temperature and bleed data
  - !Sampling
    msg_size: 1KB
    source:
      partition: sim_gateway
      port: iom_to_ecs
    destination:
      - partition: cpiom_a
        port: iom_to_ecs

  # ECS -> IOM: pack/bleed commands
  - !Sampling
    msg_size: 1KB
    source:
      partition: cpiom_a
      port: ecs_to_iom
    destination:
      - partition: sim_gateway
        port: ecs_to_iom
