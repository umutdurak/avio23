# Avio23 - Simulation Gateway (IOM) Hypervisor Configuration
# This node bridges external flight simulation data to the IMA network.

major_frame: 40ms

partitions:
  - id: 0
    name: sim_gateway
    duration: 10ms
    offset: 0ms
    period: 40ms
    image: sim_gateway
    sockets:
      - type: udp
        address: 0.0.0.0:49000
