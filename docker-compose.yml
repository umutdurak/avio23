version: '3.8'

# Avio23 IMA Platform
# Each container represents a physical Core Processing Module (CPM)
# running its own a653rs-linux hypervisor.

services:
  # The common base image that builds the workspace
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: avio23-builder:latest
    # We don't run this service, we just build it to cache the Rust compilation
    command: echo "Builder finished"

  # 1. Gateway IOM (UDP Bridge to Flight Sim)
  sim_gateway:
    image: avio23-builder:latest
    depends_on:
      - builder
    command: ["cargo", "run", "--package", "a653rs-linux-hypervisor", "--release", "--", "configs/gateway.yaml"]
    # Expose UDP port for X-Plane/MSFS connection
    ports:
      - "49000:49000/udp"
    networks:
      - afdx

  # 2. Landing Gear Domain (CPM-L)
  cpm_l_node:
    image: avio23-builder:latest
    depends_on:
      - builder
    command: ["cargo", "run", "--package", "a653rs-linux-hypervisor", "--release", "--", "configs/cpm_l.yaml"]
    networks:
      - afdx

  # 3. Fuel Domain (CPM-F)
  cpm_f_node:
    image: avio23-builder:latest
    depends_on:
      - builder
    command: ["cargo", "run", "--package", "a653rs-linux-hypervisor", "--release", "--", "configs/cpm_f.yaml"]
    networks:
      - afdx

  # 4. Air Conditioning Domain (CPM-A)
  cpm_a_node:
    image: avio23-builder:latest
    depends_on:
      - builder
    command: ["cargo", "run", "--package", "a653rs-linux-hypervisor", "--release", "--", "configs/cpm_a.yaml"]
    networks:
      - afdx

  # 5. Energy Domain (CPM-E)
  cpm_e_node:
    image: avio23-builder:latest
    depends_on:
      - builder
    command: ["cargo", "run", "--package", "a653rs-linux-hypervisor", "--release", "--", "configs/cpm_e.yaml"]
    networks:
      - afdx

# The simulated AFDX network interconnecting the nodes
networks:
  afdx:
    driver: bridge
