[package]
name = "sim_gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
a653rs = { version = "0.6", features = ["macros"] }
a653rs-linux = { path = "../../platform/a653rs-linux/partition", features = ["socket"] }
a653rs-postcard = { version = "0.4", features = ["alloc"] }
postcard = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
cpm_l = { path = "../cpm_l" }
cpm_f = { path = "../cpm_f" }
cpm_a = { path = "../cpm_a" }
cpm_e = { path = "../cpm_e" }

